name: PR guard

# Closes pull requests from outside contributors that ask for payment (bounties are unpaid and capture-only; see
# CONTRIBUTING.md). Runs on pull_request_target so it can label and close fork PRs; it never checks out or runs the
# PR's code, it only reads the PR's title and description.
on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  guard:
    name: Close payment-claim spam
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - name: Check the description for payout requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          text="$TITLE
          $BODY"
          # Wallet addresses (EVM, Tron), payout/claim wording and bounty platforms that pay out.
          pattern='0x[0-9a-fA-F]{40}|\bT[1-9A-HJ-NP-Za-km-z]{33}\b|payout|bounty claim|wallet address|BEP-?20|ERC-?20|TRC-?20|USDT|algora'
          if printf '%s' "$text" | grep -qiE "$pattern"; then
            echo "Payment request found: closing #$NUMBER"
            gh pr edit "$NUMBER" --repo "$REPO" --add-label spam || true
            gh pr close "$NUMBER" --repo "$REPO"
          else
            echo "No payment request."
          fi

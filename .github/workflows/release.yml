name: Release

# Push a tag like v0.1.1 (or run manually) to test, build and publish a release with Velopack:
#   Lockpick-win-Setup.exe     installer (per-user, no admin) with automatic updates
#   Lockpick-win-Portable.zip  portable build (also self-updating)
#   *.nupkg, releases.win.json  update packages and feed read by the in-app updater
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (without the leading v), e.g. 0.1.1
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VPK_VERSION: 1.2.161 # keep in step with the Velopack package in Directory.Packages.props

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "value=$v" >> $env:GITHUB_OUTPUT
          # Versions with a suffix (0.2.0-beta.1) are pre-releases; plain versions are normal releases the updater offers.
          "pre=$(if ($v.Contains('-')) { '--pre' } else { '' })" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/Lockpick.Tests -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Publish app
        run: dotnet publish src/Lockpick.App -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.value }} -o publish/app

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($v))\].*?(?=^## \[|\z)")
          ($(if ($m.Success) { $m.Value } else { "Lockpick $v" })) | Out-File -Encoding utf8 release-notes.md

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Download previous release (for delta updates)
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o Releases

      - name: Pack
        run: >
          vpk pack --packId Lockpick --packVersion ${{ steps.version.outputs.value }}
          --packDir publish/app --mainExe Lockpick.exe --icon src/Lockpick.App/Assets/lockpick.ico
          --packTitle "Lockpick Trainer" --packAuthors "Lockpick contributors"
          --releaseNotes release-notes.md -o Releases

      - name: Publish GitHub release
        run: >
          vpk upload github -o Releases --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish --merge
          --releaseName "Lockpick ${{ steps.version.outputs.value }}" --tag v${{ steps.version.outputs.value }}
          ${{ steps.version.outputs.pre }}

      - name: Attach probe tool (developer validation)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet publish tools/Lockpick.Probe -c Release -r win-x64 --self-contained false -p:Version=${{ steps.version.outputs.value }} -o publish/probe
          Compress-Archive -Path publish/probe/* -DestinationPath lockpick-probe-${{ steps.version.outputs.value }}-win-x64.zip
          gh release upload v${{ steps.version.outputs.value }} lockpick-probe-${{ steps.version.outputs.value }}-win-x64.zip --clobber

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 3'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning uploads on private repositories need GitHub Code Security; run only when public.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Build
        # The C# is analysed; livesplit-core's native library (Rust) isn't needed for that.
        run: dotnet build Lockpick.sln -c Release -p:SkipLiveSplitCoreBuild=true

      - uses: github/codeql-action/analyze@v4
